/**:
  ros__parameters:
    frame_id: oak_rgb_camera_optical_frame
    # /oakd/depth/image and /oakd/depth/points for Autonomous-Systems
    publish_depth: true
    # The camera is mounted upside down on both drones (cable comes out on top): turn every frame 180 deg.
    upside_down: true
    show_preview: true
    enable_stream: false
    stream_host: "10.42.0.113"
    stream_port: 5600
    stream_width: 640
    stream_height: 480
    stream_bitrate: 1000
    stream_fps: 15
