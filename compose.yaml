services:
  airborne-bridge:
    build:
      context: .
      dockerfile: airborne/Dockerfile
    container_name: airborne-bridge
    restart: unless-stopped
    init: true
    network_mode: host
    ipc: host
    stop_grace_period: 20s

    devices:
      - /dev/serial/by-id/usb-ArduPilot_Pixhawk6X_43004E000251323436333634-if00:/dev/pixhawk
      - /dev/serial/by-id/usb-FTDI_FT231X_USB_UART_D30IL4V3-if00-port0:/dev/radio

    group_add:
      - "${SERIAL_GID:-20}"

    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"

    security_opt:
      - no-new-privileges:true

    command:
      - ros2
      - run
      - airborne
      - airborne_bridge
      - --ros-args
      - -p
      - pixhawk:=/dev/pixhawk
      - -p
      - pixhawk_baud:=115200
      - -p
      - radio:=/dev/radio
      - -p
      - radio_baud:=57600
      - -p
      - stream_rate:=4

  velodyne:
    build:
      context: .
      dockerfile: LiDARS/Velodyne/Dockerfile
    container_name: velodyne
    restart: unless-stopped
    init: true
    network_mode: host
    ipc: host
    stop_grace_period: 20s

    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"

    security_opt:
      - no-new-privileges:true